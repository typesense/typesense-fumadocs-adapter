name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: xyz
          TYPESENSE_DATA_DIR: /data
        ports:
          - 8108:8108

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun ci

      - name: Wait for Typesense
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8108/health; then
              exit 0
            fi
            sleep 1
          done
          echo 'Typesense did not become healthy in time.' >&2
          exit 1

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build package
        run: bun run plugin-build

      - name: Run integration tests
        run: bun run test:integration
